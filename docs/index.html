<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>window.CPM_API_BASE='https://cpm-ground-app.onrender.com/api/v1';</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPM Ground Evidence</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#e9edf2; --surface:#ffffff; --surface-2:#f4f6f9; --surface-3:#e8ecf2;
    --border:#d9e0ea; --border-strong:#c1cbd9;
    --ink:#141d2b; --ink-2:#47566b; --ink-3:#84909f;
    --accent:#c25a17; --accent-ink:#ffffff; --accent-soft:#f5e5d8;
    --good:#137a3c; --good-bg:#dcefe2;
    --warn:#9c6400; --warn-bg:#f5e8cd;
    --bad:#bd2626; --bad-bg:#f4dbdb;
    --info:#1f5cbb; --info-bg:#dbe5f7;
    --purple:#6a3cbd; --purple-bg:#e6ddf6;
    --ring-track:#e0e5ec;
    --shadow-1:0 1px 2px rgba(20,29,43,.08);
    --shadow-2:0 8px 24px -10px rgba(20,29,43,.24);
    --scrim:rgba(14,20,29,.52);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0a121c; --surface:#121d2b; --surface-2:#0e1826; --surface-3:#172434;
      --border:#25384c; --border-strong:#374d67;
      --ink:#e6edf5; --ink-2:#a7b6c7; --ink-3:#6f8096;
      --accent:#ef8a41; --accent-ink:#1a1206; --accent-soft:#31241a;
      --good:#3ec46f; --good-bg:#0f2a1c;
      --warn:#e0a53a; --warn-bg:#2d2210;
      --bad:#f0605f; --bad-bg:#331616;
      --info:#5b9bf0; --info-bg:#122438;
      --purple:#b090ec; --purple-bg:#201a37;
      --ring-track:#25384c;
      --shadow-1:0 1px 2px rgba(0,0,0,.4);
      --shadow-2:0 12px 30px -12px rgba(0,0,0,.62);
      --scrim:rgba(2,6,11,.64);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a121c; --surface:#121d2b; --surface-2:#0e1826; --surface-3:#172434;
    --border:#25384c; --border-strong:#374d67;
    --ink:#e6edf5; --ink-2:#a7b6c7; --ink-3:#6f8096;
    --accent:#ef8a41; --accent-ink:#1a1206; --accent-soft:#31241a;
    --good:#3ec46f; --good-bg:#0f2a1c;
    --warn:#e0a53a; --warn-bg:#2d2210;
    --bad:#f0605f; --bad-bg:#331616;
    --info:#5b9bf0; --info-bg:#122438;
    --purple:#b090ec; --purple-bg:#201a37;
    --ring-track:#25384c;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 12px 30px -12px rgba(0,0,0,.62);
    --scrim:rgba(2,6,11,.64);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
  h1,h2,h3,h4{font-family:Barlow,Inter,sans-serif;margin:0;line-height:1.15;text-wrap:balance;letter-spacing:.01em}
  button{font-family:inherit}
  .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
  ::selection{background:var(--accent-soft)}

  /* shell */
  #app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow-2)}
  .appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .appbar .ttl{flex:1;min-width:0}
  .appbar .ttl b{font-family:Barlow;font-weight:700;font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .appbar .ttl span{font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
  .iconbtn{width:38px;height:38px;flex:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:11px;font-size:17px;display:grid;place-items:center;cursor:pointer}
  .iconbtn:active{transform:scale(.94)}
  .brand{width:38px;height:38px;flex:none;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:Barlow;font-weight:700;font-size:13px;letter-spacing:.02em}

  .strip{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 12px;font-size:11.5px;background:var(--surface-2);border-bottom:1px solid var(--border);color:var(--ink-2)}
  .strip .dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
  .strip.off .dot{background:var(--warn)}
  .strip b{font-weight:600;color:var(--ink)}

  .scroll{flex:1;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
  .actionbar{position:sticky;bottom:0;z-index:15;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--border)}

  /* type helpers */
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .lede{color:var(--ink-2);font-size:13.5px}
  .h-xl{font-size:26px;font-weight:700}
  .h-lg{font-size:20px;font-weight:700}
  .h-md{font-size:16px;font-weight:600}
  .muted{color:var(--ink-3)}
  .num{font-family:Barlow;font-weight:700;font-variant-numeric:tabular-nums}

  /* card / rows */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow-1)}
  .card.tight{padding:12px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:13px;text-align:left;width:100%;color:inherit;cursor:pointer;position:relative;overflow:hidden}
  .row:active{background:var(--surface-2)}
  .row .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--border-strong)}
  .row .stripe.good{background:var(--good)} .row .stripe.warn{background:var(--warn)}
  .row .stripe.bad{background:var(--bad)} .row .stripe.info{background:var(--info)} .row .stripe.mute{background:var(--ink-3)}
  .row .rmain{flex:1;min-width:0}
  .row .rmain b{font-weight:600;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .rmain small{color:var(--ink-3);font-size:12px}
  .row .chev{color:var(--ink-3);font-size:18px;flex:none}

  /* readout (instrument) */
  .readout{border:1px solid var(--border-strong);border-radius:13px;background:var(--surface-2);padding:12px 14px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:5px}
  .readout .kv{display:flex;justify-content:space-between;gap:12px}
  .readout .kv b{color:var(--ink);font-weight:500}

  /* tiles */
  .tile{background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:12px}
  .tile .k{font-family:Barlow;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
  .tile .l{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

  /* ring */
  .ring{--v:0;width:104px;height:104px;border-radius:50%;flex:none;
    background:conic-gradient(var(--accent) calc(var(--v)*1%), var(--ring-track) 0);
    display:grid;place-items:center;position:relative}
  .ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--surface)}
  .ring .rv{position:relative;font-family:Barlow;font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
  .ring .rl{position:relative;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}

  /* badges */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
  .badge .bd{width:6px;height:6px;border-radius:50%;background:currentColor}
  .b-good{color:var(--good);background:var(--good-bg)}
  .b-warn{color:var(--warn);background:var(--warn-bg)}
  .b-bad{color:var(--bad);background:var(--bad-bg)}
  .b-info{color:var(--info);background:var(--info-bg)}
  .b-purple{color:var(--purple);background:var(--purple-bg)}
  .b-mute{color:var(--ink-2);background:var(--surface-3)}
  .badge.pulse .bd{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* buttons */
  .btn{appearance:none;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:13px;padding:13px 16px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
  .btn.danger{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
  .btn.ghost{background:transparent;border-color:var(--border)}
  .btn.block{width:100%}
  .btn.sm{min-height:40px;padding:9px 12px;font-size:13px;border-radius:11px}

  /* fields */
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;font-weight:600;color:var(--ink-2)}
  .field .hint{font-size:11px;color:var(--ink-3)}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--border-strong);border-radius:11px;padding:12px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  textarea{min-height:76px;resize:vertical}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);border-radius:11px;padding:11px;font-weight:600;font-size:13px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  /* thumbs */
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
  .thumb{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;border:1px solid var(--border);background:var(--surface-3);cursor:pointer}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .tsync{position:absolute;left:4px;bottom:4px;font-size:9px;padding:2px 5px;border-radius:6px;background:rgba(0,0,0,.62);color:#fff;font-weight:600}
  .thumb.add{display:grid;place-items:center;border-style:dashed;color:var(--ink-3);font-size:24px}
  .thumb.add span{font-size:11px;font-weight:600}
  .img-missing{background:repeating-linear-gradient(45deg,var(--surface-3),var(--surface-3) 6px,var(--surface-2) 6px,var(--surface-2) 12px)}

  /* sheet + scrim */
  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:480px;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:none;max-height:88dvh;overflow:auto;animation:up .22s ease}
  .sheet .sh-hd{position:sticky;top:0;background:var(--surface);padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .sheet .sh-bd{padding:16px;display:flex;flex-direction:column;gap:12px}
  @keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .menu-link{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;cursor:pointer}
  .menu-link:last-child{border-bottom:none}
  .menu-link .mi{width:22px;text-align:center}

  /* camera */
  .cam{position:fixed;inset:0;background:#05070b;z-index:60;display:flex;flex-direction:column}
  .cam video{flex:1;width:100%;object-fit:cover;background:#05070b}
  .cam .camhud{position:absolute;top:0;left:0;right:0;padding:14px 16px calc(14px + env(safe-area-inset-top));color:#fff;display:flex;justify-content:space-between;font-size:13px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .cam .guide{position:absolute;inset:64px 26px 190px;border:2px dashed rgba(255,255,255,.82);border-radius:14px;pointer-events:none}
  .cam .guide::after{content:"Keep the unit in frame — include surrounding context";position:absolute;left:0;right:0;bottom:-30px;text-align:center;color:rgba(255,255,255,.9);font-size:11px;font-weight:600}
  .cam .gpsband{position:absolute;left:16px;right:16px;bottom:150px;color:#fff;font-family:"IBM Plex Mono",monospace;font-size:11px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .cam .camctl{position:absolute;left:0;right:0;bottom:0;padding:20px 24px calc(26px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between}
  .cam .shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.45);cursor:pointer}
  .cam .shutter:active{transform:scale(.92)}
  .cam .cambtn{color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:11px;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer;min-width:64px}
  .cam .fallback{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;padding:32px;text-align:center}
  .flash{position:fixed;inset:0;background:#fff;z-index:61;animation:flash .32s ease forwards;pointer-events:none}
  @keyframes flash{from{opacity:.9}to{opacity:0}}

  /* viewer */
  .viewer{position:fixed;inset:0;background:#05070b;z-index:62;display:flex;flex-direction:column}
  .viewer .vtop{display:flex;justify-content:space-between;padding:14px 16px calc(14px + env(safe-area-inset-top));color:#fff;font-weight:600}
  .viewer .vimg{flex:1;display:grid;place-items:center;overflow:auto;padding:8px}
  .viewer .vimg img{max-width:100%;max-height:100%;border-radius:8px}
  .viewer .vmeta{background:var(--surface);border-top:1px solid var(--border);padding:14px 16px calc(14px + env(safe-area-inset-bottom));max-height:44dvh;overflow:auto;display:flex;flex-direction:column;gap:10px}

  /* toast */
  #toast-root{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .toast{background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:var(--shadow-2);max-width:88%;animation:up .2s ease}
  .toast.bad{background:var(--bad)} .toast.good{background:var(--good)}

  .banner{border-radius:12px;padding:11px 13px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
  .banner.warn{background:var(--warn-bg);color:var(--warn)}
  .banner.bad{background:var(--bad-bg);color:var(--bad)}
  .banner.info{background:var(--info-bg);color:var(--info)}
  .banner.good{background:var(--good-bg);color:var(--good)}
  .banner b{font-weight:700}

  .divider{height:1px;background:var(--border);margin:2px 0}
  .timeline{display:flex;flex-direction:column;gap:0}
  .tl{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 0}
  .tl .tt{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
  .tl .tc{border-left:2px solid var(--border);padding-left:12px;position:relative;font-size:13px}
  .tl .tc::before{content:"";position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

  .skel{background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:10px}
  @keyframes sk{to{background-position:-200% 0}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>
</head>
<body>

<div id="app"><div class="scroll"><div class="skel" style="height:120px"></div><div class="skel" style="height:80px"></div><div class="skel" style="height:200px"></div></div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
(function(){
"use strict";

/* ============================== helpers ============================== */
var APP = document.getElementById('app');
var MODAL = document.getElementById('modal-root');
var TOASTS = document.getElementById('toast-root');
var LSKEY = 'cpm_ground_v2';
var IDB_NAME='cpm_ground_blobs', IDB_STORE='b';

var $ = function(s,r){return (r||document).querySelector(s);};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function h(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n,l){n=String(n);while(n.length<(l||2))n='0'+n;return n;}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function uid(p){return p+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();}
function fmtDate(d){d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtTime(d){d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function fmtDT(d){return fmtDate(d)+' '+fmtTime(d);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function haversine(a,b){
  var R=6371000, toR=function(x){return x*Math.PI/180;};
  var dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(s));
}
async function sha256(blob){
  try{
    var buf=await blob.arrayBuffer();
    var d=await crypto.subtle.digest('SHA-256',buf);
    return Array.prototype.map.call(new Uint8Array(d),function(b){return pad(b.toString(16));}).join('');
  }catch(e){
    var u=new Uint8Array(await blob.arrayBuffer()), hh=5381;
    for(var i=0;i<u.length;i+=1009){hh=((hh<<5)+hh+u[i])>>>0;}
    return 'djb2-'+hh.toString(16);
  }
}

/* ============================== API client ============================== */
// Base URL of the live backend. Override per-device with ?api=https://... (persisted),
// or by setting localStorage['cpm_api_base'] directly. Defaults to the local dev server.
var API_BASE=(function(){
  // Set by the mobile (Capacitor) build's index.html — its WebView origin is a fixed
  // "localhost", which would otherwise be mistaken for a local dev server below.
  if(window.CPM_API_BASE)return window.CPM_API_BASE.replace(/\/$/,'');
  try{ var q=new URLSearchParams(location.search).get('api'); if(q){localStorage.setItem('cpm_api_base',q);return q.replace(/\/$/,'');} }catch(e){}
  try{ var s=localStorage.getItem('cpm_api_base'); if(s)return s.replace(/\/$/,''); }catch(e){}
  // Same-origin deploys (the app and API served behind one CloudFront domain) need no base
  // at all — a relative path avoids CORS entirely. Only local dev needs the explicit localhost URL.
  if(location.hostname==='localhost'||location.hostname==='127.0.0.1')return 'http://127.0.0.1:8000/api/v1';
  return '/api/v1';
})();
function authHeaders(){ return (state.session&&state.session.accessToken)?{'Authorization':'Bearer '+state.session.accessToken}:{}; }
async function apiRaw(method,path,opts){
  opts=opts||{};
  var headers=Object.assign({},authHeaders(),opts.headers||{});
  var init={method:method,headers:headers};
  if(opts.idempotencyKey)headers['Idempotency-Key']=opts.idempotencyKey;
  if(opts.form){ init.body=opts.form; }
  else if(opts.body!==undefined){ headers['Content-Type']='application/json'; init.body=JSON.stringify(opts.body); }
  var res;
  try{ res=await fetch(API_BASE+path,init); }
  catch(e){ throw {code:'NETWORK',message:'Could not reach the server — check connectivity.',network:true}; }
  var data=null;
  try{ data=await res.json(); }catch(e){}
  if(!res.ok){
    var err=(data&&data.error)?Object.assign({},data.error):{code:'ERROR',message:'Request failed ('+res.status+').'};
    err.status=res.status; throw err;
  }
  return data;
}
async function tryRefresh(){
  if(!state.session||!state.session.refreshToken)return false;
  try{
    var t=await apiRaw('POST','/auth/refresh',{body:{refresh_token:state.session.refreshToken}});
    state.session.accessToken=t.access_token; state.session.refreshToken=t.refresh_token; save();
    return true;
  }catch(e){

var MEMBLOB={};
function idb(){return new Promise(function(res,rej){
  var r; try{r=indexedDB.open(IDB_NAME,1);}catch(e){return rej(e);}
  r.onupgradeneeded=function(e){e.target.result.createObjectStore(IDB_STORE);};
  r.onsuccess=function(e){res(e.target.result);};
  r.onerror=function(){rej(r.error);};
});}
async function blobPut(k,v){try{var db=await idb();await new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(v,k);tx.oncomplete=res;tx.onerror=function(){rej(tx.error);};});}catch(e){MEMBLOB[k]=v;}}
async function blobGet(k){try{var db=await idb();return await new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,'readonly');var q=tx.objectStore(IDB_STORE).get(k);q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}catch(e){return MEMBLOB[k];}}
async function blobDel(k){try{var db=await idb();await new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(k);tx.oncomplete=res;tx.onerror=function(){rej(tx.error);};});}catch(e){delete MEMBLOB[k];}}
var URLCACHE={};
async function hydrateImages(root){
  var imgs=$$('img[data-ev]',root);
  for(var i=0;i<imgs.length;i++){
    var img=imgs[i], key=img.getAttribute('data-ev');
    if(URLCACHE[key]){img.src=URLCACHE[key];continue;}
    var rec=await blobGet(key);
    var b=rec&&(rec.watermarked||rec.original);
    if(b){var u=URL.createObjectURL(b);URLCACHE[key]=u;img.src=u;}
    else{img.classList.add('img-missing');}
  }
}

var GPS={watchId:null,last:null,prev:null,suspicious:false};
function startGps(){
  if(GPS.watchId!=null||!navigator.geolocation)return;
  try{
    GPS.watchId=navigator.geolocation.watchPosition(function(p){
      var cur={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy||999,ts:p.timestamp||Date.now()};
      if(GPS.last){
        var dt=(cur.ts-GPS.last.ts)/1000, dd=haversine(GPS.last,cur);
        if(dt>0&&dt<6&&dd>300)GPS.suspicious=true;
      }
      GPS.prev=GPS.last; GPS.last=cur;
      refreshGpsBits();
    },function(){ GPS.last=null; refreshGpsBits(); },{enableHighAccuracy:true,maximumAge:4000,timeout:12000});
  }catch(e){}
}
function stopGps(){ if(GPS.watchId!=null&&navigator.geolocation){navigator.geolocation.clearWatch(GPS.watchId);} GPS.watchId=null; }
function evalGps(center){
  var c=state.config;
  if(c.testGpsAtCenter){
    return {status:'Verified',distance:12,accuracy:6,lat:center?center.lat:0,lng:center?center.lng:0,ts:Date.now(),provider:'test-mode',message:'GPS test mode — treated as at center.'};
  }
  if(!GPS.last)return {status:'Unavailable',distance:null,accuracy:null,lat:null,lng:null,ts:Date.now(),provider:'none',message:'Location unavailable. Allow location access or move to open sky.'};
  var L=GPS.last, dist=center?haversine(L,center):null;
  var out={status:'Verified',distance:dist,accuracy:Math.round(L.accuracy),lat:L.lat,lng:L.lng,ts:L.ts,provider:'gps',message:''};
  if(c.simulateMock||GPS.suspicious){out.status='Suspicious';out.message='Suspected location manipulation — session flagged for review.';return out;}
  if(dist==null){return out;}
  var margin=Math.max(L.accuracy,15);
  if(dist>c.geofenceRadius+margin){out.status='Outside Geofence';out.message='You are outside the permitted center location. Move closer to the center to capture installation evidence.';}
  else if(dist>c.geofenceRadius){out.status='Warning';out.message='Near the geofence edge and GPS is uncertain — capture allowed, distance recorded.';}
  else if(L.accuracy>c.gpsPoorAccuracy){out.status='Warning';out.message='GPS accuracy is poor (±'+Math.round(L.accuracy)+'m). Capture allowed; accuracy recorded.';}
  return out;
}
function gpsBadge(g){
  var m={'Verified':'b-good','Warning':'b-warn','Outside Geofence':'b-bad','Unavailable':'b-mute','Suspicious':'b-purple'};
  return '<span class="badge '+m[g.status]+'"><span class="bd"></span>GPS '+h(g.status)+(g.distance!=null?' · '+Math.round(g.distance)+'m':'')+'</span>';
}

async function syncEvidenceItem(item){

  if(e.deleted)return; // pre-submission deletes are never queued in the first place
  var rec=await blobGet(item.refId);
  if(!rec||!rec.original)throw {code:'BLOB_MISSING',message:'Image data is missing on this device.'};
  if(e.serverEvidenceId){
    // already uploaded once before — this queued item is a post-submission replace (PRD 41)
    var rfd=new FormData();

    if(rec.watermarked)rfd.append('watermarked',rec.watermarked,'watermarked.jpg');
    rfd.append('reason',e.lastReplaceReason||'Replaced on device');

  }

async function syncIssuePatchItem(item){

async function syncTick(){
  if(SYNC_RUN)return; if(!online())return;
  var now=Date.now();
  var item=state.syncQueue.find(function(x){return x.status==='Pending'||(x.status==='Failed'&&x.nextRetryAt<=now);});
  if(!item)return;
  SYNC_RUN=true;
  item.status='Uploading'; item.attempts=(item.attempts||0)+1; save(); maybeRefresh();
  try{
    if(item.type==='evidence')await syncEvidenceItem(item);
    else if(item.type==='submission')await syncSubmissionItem(item);
    else if(item.type==='issue')await syncIssueItem(item);
    else if(item.type==='issuepatch')await syncIssuePatchItem(item);
    else if(item.type==='patch')await syncPatchItem(item);
    else if(item.type==='instpatch')await syncInstPatchItem(item);
    item.status='Synced'; item.syncedAt=Date.now();
    applySync(item);
    audit(item.type,item.refId,'SYNCED',{});
  }catch(e){
    if(e&&e.notReady){
      item.status='Pending'; item.attempts=Math.max(0,item.attempts-1); // not a failure — just waiting on a dependency
    }else{
      item.status='Failed';
      item.nextRetryAt=now+Math.min(60000,1500*Math.pow(2,item.attempts));
      audit(item.type,item.refId,'FAILED',{reason:apiErrMsg(e)});
    }

  save(); SYNC_RUN=false; maybeRefresh();
}
function applySync(item){
  var inst=state.installations[item.instId]; if(!inst)return;
  if(item.type==='evidence'&&inst.evidence[item.refId]){ inst.evidence[item.refId].syncStatus='Synced'; inst.evidence[item.refId].uploadedAt=Date.now(); }
  if(item.type==='submission'){ inst.serverAck=true; }
  var rest=state.syncQueue.filter(function(x){return x.instId===item.instId&&x.status!=='Synced';});
  if(rest.length===0&&inst.submitted&&inst.serverAck){ tl(inst,'All evidence synced'); }
  inst.updatedAt=Date.now();
}
function queueSync(type,refId,instId){
  // dedup only against a not-yet-resolved entry — a *new* item after a prior 'Synced' one is
  // legitimate (e.g. a post-submission replace re-syncing the same evidence id with a new version).
  if(state.syncQueue.some(function(x){return x.type===type&&x.refId===refId&&(x.status==='Pending'||x.status==='Uploading');}))return;
  state.syncQueue.push({id:uid('SYQ'),type:type,refId:refId,instId:instId,status:'Pending',attempts:0,nextRetryAt:0,idempotencyKey:uid('IDK'),queuedAt:Date.now()});
}

async function dataUrlToBlob(dataUrl){

}
function openCamera(opts){
  // opts: {facing, guide, gpsText, title, onCapture(blob)}
  // Inside the native app shell, use Android's real camera app via Capacitor's Camera
  // plugin — a WebView video-preview UI (the branch below) looks and behaves like a
  // webpage because it is one; the native camera intent is what actually feels and
  // performs like a normal phone camera.

    });

  }
  var stream=null, wrap=document.createElement('div'); wrap.className='cam';
  var facing=opts.facing||'environment';
  wrap.innerHTML=
    '<video autoplay playsinline muted></video>'+
    '<div class="camhud"><span>'+h(opts.title||'Capture evidence')+'</span><span id="camcount"></span></div>'+
    (opts.guide?'<div class="guide"></div>':'')+

    '<div class="camctl"><button class="cambtn" id="camx">Cancel</button>'+
      '<button class="shutter" id="camshot" aria-label="Capture"></button>'+
      '<button class="cambtn" id="camswap">Flip</button></div>'+
    '<div class="fallback" hidden><div style="font-weight:700;font-size:16px">In-app camera unavailable here</div>'+
      '<div style="font-size:13px;opacity:.85;max-width:280px">Your browser blocked live camera in this frame. Use the device camera instead — gallery is not offered.</div>'+
      '<input type="file" accept="image/*" capture="'+(facing==='user'?'user':'environment')+'" id="camfile" style="color:#fff">'+
      '<button class="cambtn" id="camx2">Cancel</button></div>';
  document.body.appendChild(wrap);
  var video=$('video',wrap), fb=$('.fallback',wrap);
  function stop(){ if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;} }
  function done(blob){ stop(); wrap.remove(); var f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(function(){f.remove();},340); opts.onCapture(blob); }
  function fallbackMode(){ $('video',wrap).style.display='none'; $('.camctl',wrap).style.display='none'; var g=$('.guide',wrap); if(g)g.style.display='none'; $('.gpsband',wrap).style.display='none'; fb.hidden=false; }
  function begin(f){
    stop();
    navigator.mediaDevices&&navigator.mediaDevices.getUserMedia({video:{facingMode:f,width:{ideal:1920},height:{ideal:1440}},audio:false})
      .then(function(s){stream=s;video.srcObject=s;}).catch(function(){fallbackMode();});
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fallbackMode();}else{begin(facing);}
  $('#camx',wrap).addEventListener('click',function(){stop();wrap.remove();});
  $('#camx2',wrap).addEventListener('click',function(){stop();wrap.remove();});
  $('#camswap',wrap).addEventListener('click',function(){facing=(facing==='user'?'environment':'user');begin(facing);});
  $('#camshot',wrap).addEventListener('click',function(){
    if(!stream){fallbackMode();return;}
    var vw=video.videoWidth||1280, vh=video.videoHeight||960;

function loadImage(blob){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(blob), img=new Image();

function roundRect(ctx,x,y,w,r){ ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w.w,y,x+w.w,y+w.h,r);ctx.arcTo(x+w.w,y+w.h,x,y+w.h,r);ctx.arcTo(x,y+w.h,x,y,r);ctx.arcTo(x,y,x+w.w,y,r);ctx.closePath(); }
async function watermark(srcBlob,wm){
  var l=await loadImage(srcBlob), img=l.img;
  var maxSide=state.config.maxImageSide;
  var w=img.naturalWidth||img.width, ht=img.naturalHeight||img.height;
  var sc=Math.min(1,maxSide/Math.max(w,ht)); w=Math.round(w*sc); ht=Math.round(ht*sc);
  var c=document.createElement('canvas'); c.width=w; c.height=ht;
  var ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,ht);
  URL.revokeObjectURL(l.url);
  var padX=Math.round(w*0.035);
  var fs=clamp(Math.round(w*0.030),12,26);
  var lines=wm.lines, lh=Math.round(fs*1.5);
  var bandH=lh*lines.length+Math.round(fs*1.4);
  var g=ctx.createLinearGradient(0,ht-bandH,0,ht);
  g.addColorStop(0,'rgba(6,10,16,0)'); g.addColorStop(0.22,'rgba(6,10,16,0.5)'); g.addColorStop(1,'rgba(6,10,16,0.84)');
  ctx.fillStyle=g; ctx.fillRect(0,ht-bandH,w,bandH);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  for(var i=0;i<lines.length;i++){
    var y=ht-bandH+Math.round(fs*1.1)+lh*i+fs;
    ctx.font=(i===0?'600 ':'400 ')+fs+'px Inter, system-ui, sans-serif';
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillText(lines[i],padX+1,y+1);
    ctx.fillStyle=(i===0?'#ffffff':'rgba(255,255,255,0.92)'); ctx.fillText(lines[i],padX,y);
  }
  ctx.font='700 '+Math.round(fs*0.82)+'px Barlow, Inter, sans-serif';
  var chip='CPM EVIDENCE', cw=ctx.measureText(chip).width, chW=cw+fs*1.2, chH=fs*1.9;
  ctx.fillStyle='rgba(194,90,23,0.92)';
  roundRect(ctx,w-chW-padX,padX,{w:chW,h:chH},7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(chip,w-chW-padX+fs*0.6,padX+fs*1.32);
  var out=await new Promise(function(res){ c.toBlob(function(b){res(b);},'image/jpeg',state.config.jpegQuality); });
  return out;
}

          lat:c.latitude,lng:c.longitude,state:c.state,city:c.city};

  }catch(e){

function isDeleted(inst,evId){ var e=inst.evidence[evId]; return !!(e&&e.deleted); }
function livePhotos(inst,arr){ return (arr||[]).filter(function(id){return !isDeleted(inst,id);}); }
function camsWithEvidence(inst){ return inst.cameras.filter(function(c){return livePhotos(inst,c.photoIds).length>0;}).length; }

async function addEvidence(inst,equip){
  // equip: {type,unitNumber,location,equipmentId, arrRef:function->array}
  return new Promise(function(resolve){
    var g=evalGps({lat:inst.centerLat,lng:inst.centerLng});
    if(g.status==='Outside Geofence'){
      sheet('Outside center location','<div class="banner bad">'+h(g.message)+'</div>'+
        '<div class="readout"><div class="kv"><span>Distance</span><b>'+(g.distance!=null?Math.round(g.distance)+' m':'—')+'</b></div>'+
        '<div class="kv"><span>Geofence</span><b>'+state.config.geofenceRadius+' m</b></div></div>'+
        '<button class="btn block" id="okc">Understood</button>');
      $('#okc').addEventListener('click',closeSheet);
      resolve(false); return;
    }
    var gtxt=(g.lat!=null?g.lat.toFixed(5)+', '+g.lng.toFixed(5):'GPS —')+'  ·  ±'+(g.accuracy!=null?g.accuracy:'?')+'m  ·  '+g.status;
    openCamera({facing:'environment',guide:true,gpsText:gtxt,title:equip.type+' '+equip.unitNumber,onCapture:async function(raw){
      try{
        var evId=uid('EVD');
        var wm=await watermark(raw,{lines:[
          inst.centerCode+' · '+inst.centerName,
          equip.type+' '+equip.unitNumber+' · '+(equip.location||'—'),
          fmtDate(Date.now())+'  '+fmtTime(Date.now()),
          (g.lat!=null?g.lat.toFixed(5)+', '+g.lng.toFixed(5):'GPS unavailable')+'   GPS '+(g.status==='Verified'?'✓ Verified':'⚠ '+g.status),
          'TECH '+inst.technicianId
        ]});
        var hash=await sha256(raw);
        await blobPut(evId,{original:raw,watermarked:wm,versions:[]});
        inst.evidence[evId]={
          evidenceId:evId, installationId:inst.id, equipmentId:equip.equipmentId, equipmentType:equip.type,
          unitNumber:equip.unitNumber, location:equip.location||null, technicianId:inst.technicianId,
          date:fmtDate(Date.now()), time:fmtTime(Date.now()),
          lat:g.lat, lng:g.lng, gpsAccuracy:g.accuracy, gpsVerified:g.status==='Verified', gpsStatus:g.status,
          hash:hash, version:1, syncStatus:'Pending', createdAt:Date.now(), updatedAt:Date.now(),
          deleted:false
        };
        equip.arrRef().push(evId);
        if(inst.status==='Not Started')inst.status='In Progress';
        tl(inst,equip.type+' '+equip.unitNumber+' evidence captured');
        audit('evidence',evId,'CREATED',{newValue:equip.type+' '+equip.unitNumber});
        if(inst.submitted)queueSync('evidence',evId,inst.id);
        inst.updatedAt=Date.now(); save(); resolve(true);
      }catch(e){ toast('Could not process photo: '+e.message,'bad'); resolve(false); }
    }});
  });
}

async function deleteEvidence(inst,evId){
  var reason=await promptText('Delete photo','Why are you deleting this evidence?','Incorrect photograph');
  if(reason==null)return;
  var e=inst.evidence[evId]; if(!e)return;
  e.deleted=true; e.deleteReason=reason; e.updatedAt=Date.now();
  await blobDel(evId); delete URLCACHE[evId];
  audit('evidence',evId,'DELETED',{reason:reason,oldValue:e.equipmentType+' '+e.unitNumber});
  tl(inst,'Evidence '+evId.slice(0,10)+' deleted');
  save(); toast('Evidence deleted — audit event recorded'); render();
}
async function replaceEvidence(inst,evId){
  var reason=await promptText('Replace evidence','Reason for replacement (kept in audit history)','Better angle / clearer image');
  if(reason==null)return;
  var e=inst.evidence[evId]; if(!e)return;
  var g=evalGps({lat:inst.centerLat,lng:inst.centerLng});
  openCamera({facing:e.equipmentType==='Selfie'?'user':'environment',guide:e.equipmentType!=='Selfie',gpsText:g.status,title:'Replace '+e.equipmentType+' '+e.unitNumber,onCapture:async function(raw){
    try{
      var rec=await blobGet(evId)||{versions:[]};
      rec.versions=rec.versions||[]; if(rec.watermarked)rec.versions.push({blob:rec.watermarked,version:e.version,ts:Date.now(),reason:reason});
      var wm=await watermark(raw,{lines:[
        inst.centerCode+' · '+inst.centerName,
        e.equipmentType+' '+e.unitNumber+' · REPLACED v'+(e.version+1),
        fmtDate(Date.now())+'  '+fmtTime(Date.now()),
        (g.lat!=null?g.lat.toFixed(5)+', '+g.lng.toFixed(5):'GPS unavailable')+'   GPS '+g.status,
        'TECH '+inst.technicianId
      ]});
      rec.original=raw; rec.watermarked=wm;
      await blobPut(evId,rec); delete URLCACHE[evId];
      var oldHash=e.hash; e.hash=await sha256(raw); e.version++; e.updatedAt=Date.now(); e.syncStatus='Pending'; e.lastReplaceReason=reason;
      audit('evidence',evId,'REPLACED',{reason:reason,oldValue:'v'+(e.version-1)+' '+oldHash.slice(0,12),newValue:'v'+e.version+' '+e.hash.slice(0,12)});
      tl(inst,e.equipmentType+' '+e.unitNumber+' evidence replaced (v'+e.version+')');
      queueSync('evidence',evId,inst.id);
      save(); toast('Evidence replaced — previous version retained'); render();
    }catch(err){ toast('Replace failed: '+err.message,'bad'); }
  }});
}

function dupSerialLocal(serial){
  // offline fallback only — scans what's on this device when /assets/check can't be reached
  var insts=state.installations;
  for(var k in insts){ var it=insts[k];
    var all=[].concat(it.cameras,it.monitors,it.upsUnits,it.routers);
    for(var i=0;i<all.length;i++){ if(all[i].serial&&all[i].serial.toLowerCase()===serial.toLowerCase()&&it.id!==state.activeId){ return {serial:serial,centerCode:it.centerCode,type:'prior installation (this device, unconfirmed)'}; } }
  }
  return null;
}
async function dupSerial(serial){
  serial=(serial||'').trim(); if(!serial)return null;
  try{
    var r=await api('GET','/assets/check?serial='+encodeURIComponent(serial));
    if(r.duplicate&&r.conflict)return {serial:serial,centerCode:r.conflict.center_code||r.conflict.installation_id,type:r.conflict.equipment_type||r.conflict.source};
    return null;
  }catch(e){ return dupSerialLocal(serial); }
}

/* ============================== compliance ============================== */
function compliance(inst){
  var parts=[], exp=inst.expectedCctv||0;
  var cwe=camsWithEvidence(inst);
  parts.push({label:'Start selfie',v:inst.startSelfieId?1:0,w:1});
  parts.push({label:'Submission selfie',v:inst.submitSelfieId?1:0,w:1});
  parts.push({label:'CCTV evidence ('+cwe+'/'+(exp||inst.cameras.length||0)+')',v:exp?clamp(cwe/exp,0,1):(inst.cameras.length?1:0),w:4});
  parts.push({label:'Monitor evidence',v:inst.monitors.some(function(u){return livePhotos(inst,u.photoIds).length;})?1:0,w:1});
  parts.push({label:'UPS evidence',v:inst.upsUnits.some(function(u){return livePhotos(inst,u.photoIds).length;})?1:0,w:1});
  var r=inst.routers[0];
  parts.push({label:'Router photo',v:(r&&livePhotos(inst,r.photoIds).length)?1:0,w:1});
  parts.push({label:'Internet working answered',v:(r&&r.working!=null)?1:0,w:1});
  parts.push({label:'All issues have evidence',v:inst.issues.length?(inst.issues.every(function(i){return i.photoId;})?1:0):1,w:1});
  var num=0,den=0; parts.forEach(function(p){num+=p.v*p.w;den+=p.w;});
  return {percent:den?Math.round(num/den*100):0,parts:parts};
}

  hydrateImages(APP); bindThumbs(APP);
  $('#camloc').addEventListener('change',function(e){ $('#customWrap').hidden=(e.target.value!=='Other'); });
  function pull(){
    var num=$('#camnum').value.trim()||cam.number;
    if(inst.cameras.some(function(c){return c.id!==cam.id&&c.number.toLowerCase()===num.toLowerCase();})){
      toast('Camera number "'+num+'" is already used in this installation','bad'); return false;
    }
    var old={number:cam.number,location:cam.location,customLocation:cam.customLocation,status:cam.status,remarks:cam.remarks};

    if(old.number!==num)audit('equipment',cam.id,'UPDATED',{oldValue:old.number,newValue:num});
    cam.updatedAt=Date.now(); inst.updatedAt=Date.now();
    if(old.number!==cam.number||old.location!==cam.location||old.customLocation!==cam.customLocation||old.status!==cam.status||old.remarks!==cam.remarks){
      queuePatch(cam.id,{unit_number:cam.number,location:cam.location,custom_location:cam.customLocation,status:cam.status,remarks:cam.remarks},inst.id);
    }
    save(); return true;
  }
  var cc=$('#capCam');
  if(cc)cc.addEventListener('click',function(){
    if(!pull())return;
    if(!cam.location){toast('Select a location before capturing','bad');return;}
    addEvidence(inst,{type:'CCTV',unitNumber:cam.number,location:cam.location==='Other'?cam.customLocation:cam.location,equipmentId:cam.id,arrRef:function(){return cam.photoIds;}}).then(function(ok){ if(ok)render(); });
  });
  $('#camIssue').addEventListener('click',function(){ if(!pull())return; CPM.go('#/issue/new/cam/'+encodeURIComponent(cam.id)); });
  $('#saveCam').addEventListener('click',function(){ if(pull()){toast('Camera saved');CPM.go('#/cctv');} });
  $('#saveNext').addEventListener('click',async function(){
    if(!pull())return;
    var i=inst.cameras.indexOf(cam);
    var nextIncomplete=null;
    for(var k=i+1;k<inst.cameras.length;k++){ if(livePhotos(inst,inst.cameras[k].photoIds).length<state.config.minPhotos){nextIncomplete=inst.cameras[k];break;} }
    if(!nextIncomplete&&inst.cameras.length<inst.expectedCctv){
      var n=inst.cameras.length+1, num='CAM-'+pad(n);
      while(inst.cameras.some(function(c){return c.number===num;})){n++;num='CAM-'+pad(n);}
      var resp=await createEquipment(inst,{equipment_type:'CCTV',unit_number:num,status:'Installed'});
      if(!resp)return;
      nextIncomplete={id:resp.equipment_id,number:num,location:'',customLocation:'',status:'Installed',remarks:'',photoIds:[],issueId:null};
      inst.cameras.push(nextIncomplete); tl(inst,'Camera '+num+' added'); save();
    }
    if(nextIncomplete){CPM.go('#/cam/'+encodeURIComponent(nextIncomplete.id));}
    else {toast('All cameras have evidence');CPM.go('#/cctv');}
  });
}};

},after:function(){
  bindChrome();
  if(!state.session||state.session.role!=='SystemAdministrator')return;
  var mode='otp';
  function paintIdent(){
    var f=$('#unIdentForm');
    if(mode==='otp'){
      f.innerHTML='<div class="field"><label for="unMobile">Email address</label><input id="unMobile" type="email" placeholder="person@example.com"></div>';
    }else{
      f.innerHTML='<div class="field"><label for="unVc">Vendor code</label><input id="unVc" placeholder="VEND-XXX-00"></div>'+
        '<div class="field"><label for="unPw">Password</label><input id="unPw" type="password"></div>';
    }
  }
  $('#unTabOtp').addEventListener('click',function(){mode='otp';$('#unTabOtp').setAttribute('aria-pressed','true');$('#unTabVc').setAttribute('aria-pressed','false');paintIdent();});
  $('#unTabVc').addEventListener('click',function(){mode='vc';$('#unTabVc').setAttribute('aria-pressed','true');$('#unTabOtp').setAttribute('aria-pressed','false');paintIdent();});
  paintIdent();

  async function loadUsers(){
    try{
      var users=await api('GET','/admin/users');
      $('#unCount').textContent=users.length;
      $('#unList').innerHTML=users.length?users.map(function(u){
        var ident=u.email?('email '+u.email):(u.vendor_code?('vendor code '+u.vendor_code):(u.mobile_number?('mobile '+u.mobile_number):'—'));
        var disabled=u.status&&u.status!=='active';
        return '<div class="row" style="cursor:default"><span class="stripe '+(disabled?'mute':'good')+'"></span>'+
          '<div class="rmain"><b>'+h(u.name)+'</b><small>'+h(u.user_id)+' · '+h(u.role)+' · '+h(ident)+(disabled?' · disabled':'')+'</small></div>'+
          '<button class="btn sm ghost" data-toggle="'+h(u.user_id)+'" data-status="'+(disabled?'active':'disabled')+'">'+(disabled?'Enable':'Disable')+'</button>'+
        '</div>';
      }).join(''):'<div class="banner info">No one added yet.</div>';
      $$('[data-toggle]',$('#unList')).forEach(function(el){
        el.addEventListener('click',async function(){
          try{ await api('PATCH','/admin/users/'+el.getAttribute('data-toggle'),{body:{status:el.getAttribute('data-status')}}); toast('Updated'); loadUsers(); }
          catch(e){ toast(apiErrMsg(e),'bad'); }
        });

  loadUsers();

    var name=$('#unName').value.trim(); if(!name){toast('Enter a name','bad');return;}
    var body={name:name,role:$('#unRole').value};
    if(mode==='otp'){
      var mob=$('#unMobile').value.trim(); if(!mob||mob.indexOf('@')<0){toast('Enter a valid email address','bad');return;}

    }catch(e){ toast(apiErrMsg(e),'bad'); }
  });
}};

/* ============================== router ============================== */
function redir(hash){ setTimeout(function(){CPM.go(hash);},0); return '<div class="scroll"><div class="skel" style="height:120px"></div></div>'; }
var TECH_ONLY=['home','projects','project','center','selfie','dash','cctv','cam','monitor','ups','internet','issue','review','submit'];
function render(){
  var raw=location.hash||'#/';
  var path=raw.replace(/^#\/?/,'').split('?')[0];
  var parts=path.split('/').filter(function(x){return x!=='';});
  var route=parts[0]||'';
  // auth guard
  if(!state.session){
    if(route!=='login'){ location.replace('#/login'); return; }
  } else {
    if(state.config.sessionTimeoutMin&&Date.now()-state.session.loginAt>state.config.sessionTimeoutMin*60000){
      audit('auth',state.session.userId,'SESSION_TIMEOUT',{}); state.session=null; save();
      toast('Session expired — sign in again','bad'); location.replace('#/login'); return;
    }
    if(route===''||route==='login'){ location.replace(state.session.role==='Technician'?'#/home':'#/stakeholder'); return; }
    if(state.session.role!=='Technician'&&TECH_ONLY.indexOf(route)>=0){ location.replace('#/stakeholder'); return; }
  }
  var view=VIEWS[route]||VIEWS[state.session?(state.session.role==='Technician'?'home':'stakeholder'):'login'];
  try{
    APP.innerHTML=view.html(parts.slice(1));
    if(view.after&&APP.querySelector('.appbar'))view.after(parts.slice(1));
  }catch(e){
    APP.innerHTML='<div class="scroll"><div class="banner bad"><b>Screen error.</b> '+h(e.message)+'</div><button class="btn block" onclick="location.hash=\'#/home\'">Go home</button></div>';
    console.error(e);
  }
  hydrateImages(APP); bindThumbs(APP);
  var sc=$('.scroll'); if(sc)sc.scrollTop=0;
}
function softRefresh(){
  // re-render current screen without scroll reset, used by sync/gps updates
  var y=($('.scroll')||{}).scrollTop||0;
  render();
  var sc=$('.scroll'); if(sc)sc.scrollTop=y;
}
function maybeRefresh(){
  // only re-render screens that display live sync/queue state — never blow away a form in progress
  var r=(location.hash||'').replace(/^#\/?/,'').split(/[\/?]/)[0];
  if(['sync','home','dash','history','rec',''].indexOf(r)>=0)softRefresh();
  else updateStrip();
}
var CPM={
  go:function(hash){ if(location.hash===hash){render();}else{location.hash=hash;} },
  back:function(){ if(history.length>1){history.back();} else {CPM.go('#/home');} },
  menu:openMenu
};
window.CPM=CPM;
window.addEventListener('hashchange',render);

// Native Android back button (Capacitor). Without this, Android's default handling
// doesn't reliably map to a hash-router SPA and just exits the app instead of
// navigating back within it. No-op outside the native wrapper (window.Capacitor
// is only defined there), so this is harmless in a plain browser.
(function(){
  var CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(!CapApp)return;
  var ROOT_ROUTES={'home':1,'stakeholder':1,'login':1,'':1};
  CapApp.addListener('backButton',function(){
    if(MODAL&&MODAL.innerHTML){ closeSheet(); return; } // dismiss an open sheet/modal first
    var route=(location.hash||'').replace(/^#\/?/,'').split(/[\/?]/)[0];
    if(!state.session||ROOT_ROUTES[route]){ CapApp.minimizeApp(); }
    else { CPM.back(); }
  });
})();

/* ============================== theme + lifecycle ============================== */
function applyTheme(){
  if(state.ui&&state.ui.theme){ document.documentElement.setAttribute('data-theme',state.ui.theme); }
  else { document.documentElement.removeAttribute('data-theme'); }
}
async function checkDevice(){
  try{
    if(navigator.storage&&navigator.storage.estimate){
      var est=await navigator.storage.estimate();
      var freeMB=(est.quota-est.usage)/1048576;
      if(freeMB<200){ toast('Device storage low (~'+Math.round(freeMB)+' MB). Free space before capturing more.','bad'); }
    }
  }catch(e){}
  try{
    if(navigator.getBattery){
      var b=await navigator.getBattery();
      if(b.level<0.15&&!b.charging){ toast('Battery critically low — active work is saved as you go.','bad'); }
    }
  }catch(e){}
}
function syncPump(n){ var i=0; (function step(){ if(i++>=n)return; syncTick().then(function(){ setTimeout(step,300); }); })(); }

/* ============================== boot ============================== */
load();
applyTheme();
if(state.session&&state.session.role==='Technician'&&state.activeId&&state.installations[state.activeId]&&!state.installations[state.activeId].submitted){
  // crash recovery — keep activeId, land on home which shows the resume card
}
startGps();
render();
checkDevice();
if(state.session&&online())loadCatalog().then(function(){ if((location.hash||'').indexOf('projects')>=0||(location.hash||'').indexOf('project/')>=0)softRefresh(); });
setInterval(function(){ syncTick(); },3600);
setInterval(function(){ updateStrip(); },5000);
window.addEventListener('online',function(){ updateStrip(); syncPump(4); softRefreshIfSync(); });
window.addEventListener('offline',function(){ updateStrip(); softRefreshIfSync(); });
function softRefreshIfSync(){ var r=(location.hash||'').indexOf('sync')>=0; if(r)softRefresh(); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ updateStrip(); syncTick(); } });

})();
</script>
