AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CPM Ground App - "allocated space" (Stack 1/3): dedicated VPC, private subnets,
  RDS Postgres (password managed by Secrets Manager), the S3 evidence bucket, and
  the JWT signing secret. No internet gateway / NAT — App Runner reaches these over
  a VPC Connector, and S3 is reached via a free Gateway VPC Endpoint.

Parameters:
  ProjectName:
    Type: String
    Default: cpm-ground-app
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
  SubnetACidr:
    Type: String
    Default: 10.42.0.0/24
  SubnetBCidr:
    Type: String
    Default: 10.42.1.0/24
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
  DBEngineVersion:
    Type: String
    Default: "16.4"
    Description: Check `aws rds describe-db-engine-versions --engine postgres --region ap-south-1` for a currently-supported value before deploying.
  DBAllocatedStorageGB:
    Type: Number
    Default: 20
  DBName:
    Type: String
    Default: cpm
  DBMasterUsername:
    Type: String
    Default: cpmadmin

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-vpc" }
        - { Key: Project, Value: !Ref ProjectName }

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref SubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-private-a" }
        - { Key: Project, Value: !Ref ProjectName }

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref SubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-private-b" }
        - { Key: Project, Value: !Ref ProjectName }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-private-rt" }

  SubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref PrivateRouteTable

  SubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref PrivateRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  AppRunnerConnectorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Attached to the App Runner VPC Connector; egress only.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-apprunner-connector-sg" }

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Postgres access from the App Runner connector only.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppRunnerConnectorSecurityGroup
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-rds-sg" }

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} private subnets"
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: postgres
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorageGB
      StorageType: gp3
      DBName: !Ref DBName
      MasterUsername: !Ref DBMasterUsername
      ManageMasterUserPassword: true
      VPCSecurityGroups: [!Ref RDSSecurityGroup]
      DBSubnetGroupName: !Ref DBSubnetGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-evidence-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 90 }
      Tags:
        - { Key: Project, Value: !Ref ProjectName }

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/jwt-secret"
      Description: HS256 signing key for CPM_JWT_SECRET
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: jwt_secret
        PasswordLength: 64
        ExcludePunctuation: true

Outputs:
  VpcId:
    Value: !Ref Vpc
  PrivateSubnetIds:
    Value: !Join [",", [!Ref SubnetA, !Ref SubnetB]]
  AppRunnerConnectorSecurityGroupId:
    Value: !Ref AppRunnerConnectorSecurityGroup
  RDSEndpointAddress:
    Value: !GetAtt DBInstance.Endpoint.Address
  RDSEndpointPort:
    Value: !GetAtt DBInstance.Endpoint.Port
  RDSSecretArn:
    Value: !GetAtt DBInstance.MasterUserSecret.SecretArn
  DBName:
    Value: !Ref DBName
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  JwtSecretArn:
    Value: !Ref JwtSecret
