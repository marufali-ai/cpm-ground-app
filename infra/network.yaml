AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CPM Ground App (Stack 1/3, free-tier shape): VPC with one public subnet (for the
  EC2 backend) and two private subnets (for the RDS subnet group), RDS Postgres
  (db.t4g.micro, free tier), and the S3 bucket used for both deploy-source zips and
  evidence storage. No NAT gateway - the private subnets don't need internet egress.

Parameters:
  ProjectName:
    Type: String
    Default: cpm-ground-app
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.42.0.0/24
  PrivateSubnetACidr:
    Type: String
    Default: 10.42.1.0/24
  PrivateSubnetBCidr:
    Type: String
    Default: 10.42.2.0/24
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
  DBEngineVersion:
    Type: String
    Default: "17.11"
    Description: Check `aws rds describe-db-engine-versions --engine postgres` for a currently-supported value before deploying.
  DBAllocatedStorageGB:
    Type: Number
    Default: 20
  DBName:
    Type: String
    Default: cpm
  DBMasterUsername:
    Type: String
    Default: cpmadmin
  DBMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Generated by deploy.ps1 - not stored in Secrets Manager, to stay $0 (RDS free tier has no allowance for it).

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-igw" }]

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public" }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-private-a" }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-private-b" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-public-rt" }]

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} backend - HTTP inbound (fronted by CloudFront in practice), no SSH (use SSM Session Manager)"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-ec2-sg" }]

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Postgres access from the backend EC2 instance only.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref Ec2SecurityGroup
      Tags: [{ Key: Name, Value: !Sub "${ProjectName}-rds-sg" }]

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} private subnets"
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: postgres
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorageGB
      StorageType: gp2
      DBName: !Ref DBName
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Ref DBMasterPassword
      VPCSecurityGroups: [!Ref RDSSecurityGroup]
      DBSubnetGroupName: !Ref DBSubnetGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersionsAndSrc
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 90 }
          - Id: ExpireOldDeploySources
            Status: Enabled
            Prefix: src/
            ExpirationInDays: 30
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

Outputs:
  VpcId: { Value: !Ref Vpc }
  PublicSubnetId: { Value: !Ref PublicSubnet }
  PrivateSubnetIds: { Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]] }
  Ec2SecurityGroupId: { Value: !Ref Ec2SecurityGroup }
  RDSEndpointAddress: { Value: !GetAtt DBInstance.Endpoint.Address }
  RDSEndpointPort: { Value: !GetAtt DBInstance.Endpoint.Port }
  DBName: { Value: !Ref DBName }
  DBMasterUsername: { Value: !Ref DBMasterUsername }
  BucketName: { Value: !Ref AppBucket }
